#ddev-generated
# Mounts the shared ddev-global-cache volume in web and points the package
# manager caches back at it, as DDEV did before v1.25.6, so every project
# shares one download cache instead of each keeping its own.
# Yarn needs a start-up step, web-entrypoint.d/global-cache.sh, which reads
# GLOBAL_CACHE_YARN_DIR.
services:
  web:
    volumes:
      - ddev-global-cache:/mnt/ddev-global-cache
    environment:
      - COMPOSER_CACHE_DIR=/mnt/ddev-global-cache/composer
      - COREPACK_HOME=/mnt/ddev-global-cache/corepack
      - npm_config_cache=/mnt/ddev-global-cache/npm
      - PIP_CACHE_DIR=/mnt/ddev-global-cache/pip
      - GLOBAL_CACHE_YARN_DIR=/mnt/ddev-global-cache/yarn

volumes:
  ddev-global-cache:
    name: ddev-global-cache
    external: true
